version: '3.8'

services:
  # Cơ sở dữ liệu quan hệ PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: production-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mini_wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  # Redis Cache & Memory Store
  redis:
    image: redis:7-alpine
    container_name: production-redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  # Zookeeper phục vụ Kafka
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: production-zookeeper
    ports:
      - "2181:2181"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  # Apache Kafka Message Broker
  kafka:
    image: wurstmeister/kafka:latest
    container_name: production-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "transaction-events:3:1"
    depends_on:
      - zookeeper
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  # API Gateway Service
  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: production-gateway-service
    ports:
      - "8080:8080"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  # Authentication Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: production-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mini_wallet
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  # Wallet Core Service
  wallet-service:
    build:
      context: .
      dockerfile: services/wallet-service/Dockerfile
    container_name: production-wallet-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mini_wallet
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - db
      - redis
      - kafka
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: production-notification-service
    ports:
      - "8086:8086"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  # Next.js Frontend Web UI Dashboard
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: production-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
      NEXT_PUBLIC_NOTIFICATION_URL: http://localhost:8086
    depends_on:
      - gateway-service
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always
